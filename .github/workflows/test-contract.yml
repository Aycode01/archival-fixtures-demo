# test-contract.yml — build and unit-test the rapid-expiry-demo contract.
#
# Runs on every push to main and every pull request so contract breakage
# (like the SDK-version mismatch this workflow now guards against) is caught
# in CI instead of at deploy time. Job name: contract-tests (used by branch
# protection as a required status check).

name: test-contract

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable + wasm32v1-none)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      # Runs before the Rust steps so a malformed manifest fails fast. This is a
      # step inside the existing `contract-tests` job, deliberately NOT a new
      # required branch-protection check — adding one would change merge
      # behaviour, which belongs to the repo owner, not to this task (issue #4),
      # and the required check's name must stay `contract-tests`.
      - name: Validate contracts.yml against the consumer schema
        run: |
          set -euo pipefail
          python3 -c "import yaml" 2>/dev/null \
            || python3 -m pip install --quiet --break-system-packages pyyaml \
            || python3 -m pip install --quiet --user pyyaml
          bash scripts/tests/validate-contracts-schema.test.sh

      - name: cargo test (real testnet TTL parameters)
        run: cargo test --manifest-path contracts/rapid-expiry-demo/Cargo.toml

      - name: cargo build (release wasm for deployment)
        run: cargo build --manifest-path contracts/rapid-expiry-demo/Cargo.toml --target wasm32v1-none --release