# demo-restore.yml — manually-triggered restore of the demo entry on TESTNET.
#
# This is the remediation half of the demo: run it (via the "Run workflow"
# button) once the scheduled demo-scan.yml has gone red — i.e. the entry is
# Critical or Archived. It:
#
#   1. Detects the entry's state off-chain via scripts/read-entry-ttl.py
#      (RPC `getLedgerEntries`; TTL 0 means archived — contracts cannot read
#      their own TTL, and the RPC rejects direct TTL-key queries).
#   2. If archived, submits a RestoreFootprintOp via `stellar contract
#      restore` so the entry comes back live at the network-minimum TTL.
#   3. Raises the TTL to `extend_to` ledgers through the contract's `extend`
#      (a no-op floor while the TTL is already higher).
#   4. Re-reads the TTL off-chain and fails the run if it did not take.
#
# ⚠️  TESTNET ONLY. The key used below is the TESTNET-ONLY throwaway key
# generated by scripts/deploy-and-shrink-ttl.sh. It holds only testnet
# lumens and can be discarded anytime. Never put a mainnet key in these
# secrets and never point SOROBAN_RPC_URL at mainnet.
#
# Setup (same as demo-scan.yml):
#   1. Deploy once locally:  ./scripts/deploy-and-shrink-ttl.sh
#   2. Actions -> Variables -> New repository variable:
#        Name: CONTRACT_ID,  Value: <the contract id printed by step 1>
#   3. Actions -> Secrets -> New repository secret:
#        Name: TESTNET_THROWAWAY_SECRET_KEY,
#        Value: <the S... key in .deploy/testnet-throwaway.secret>
#   4. Run via the "Run workflow" button.

name: demo-restore

on:
  workflow_dispatch:
    inputs:
      contract_id:
        description: "Contract id to restore (defaults to the CONTRACT_ID repository variable)"
        required: false
        type: string
      entry_key:
        description: "Storage key symbol to restore (the demo's persistent entry)"
        required: false
        type: string
        default: VALUE
      extend_to:
        description: "TTL in ledgers to raise the entry to after restore (default: testnet minPersistentTTL, 120960 ≈ 7 days)"
        required: false
        type: string
        default: "120960"

permissions:
  contents: read

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stellar-cli
        run: |
          curl -fsSL https://raw.githubusercontent.com/stellar/stellar-cli/main/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Restore and extend the demo entry
        id: restore
        env:
          CONTRACT_ID: ${{ inputs.contract_id || vars.CONTRACT_ID }}
          THROWAWAY_KEY: ${{ secrets.TESTNET_THROWAWAY_SECRET_KEY }}
          ENTRY_KEY: ${{ inputs.entry_key || 'VALUE' }}
          EXTEND_TO: ${{ inputs.extend_to || '120960' }}
        run: |
          set -euo pipefail
          RPC="https://soroban-testnet.stellar.org"
          PASSPHRASE="Test SDF Network ; September 2015"

          [[ -n "${CONTRACT_ID:-}" ]] || { echo "::error::CONTRACT_ID is not set — pass it as a workflow input or set the CONTRACT_ID repository variable (see workflow header)"; exit 1; }
          [[ -n "${THROWAWAY_KEY:-}" ]] || { echo "::error::TESTNET_THROWAWAY_SECRET_KEY secret is not set (see workflow header)"; exit 1; }
          [[ "$THROWAWAY_KEY" == S* ]] || { echo "::error::TESTNET_THROWAWAY_SECRET_KEY does not look like a testnet secret key — this repo is TESTNET-ONLY"; exit 1; }

          echo "contract=$CONTRACT_ID entry=$ENTRY_KEY rpc=$RPC (TESTNET ONLY)"

          read_ttl() { python3 scripts/read-entry-ttl.py --contract-id "$CONTRACT_ID" --entry-key "$ENTRY_KEY" --rpc-url "$RPC"; }

          # --- 1. Detect the entry's state off-chain. ---
          TTL="$(read_ttl)"
          echo "pre-restore ttl=$TTL ledgers"

          if (( TTL <= 0 )); then
            echo "entry is ARCHIVED — restoring with RestoreFootprintOp..."
            stellar contract restore \
                --id "$CONTRACT_ID" --source "$THROWAWAY_KEY" \
                --key "$ENTRY_KEY" --durability persistent \
                --rpc-url "$RPC" --network-passphrase "$PASSPHRASE"
            echo "restore submitted — entry is live again at the network-minimum TTL"
          else
            echo "entry is LIVE — nothing to restore; extending as a floor"
          fi

          # --- 2. Raise the TTL (no-op while it is already at/above the target). ---
          echo "extending entry to at least ${EXTEND_TO} ledgers..."
          stellar contract invoke \
              --id "$CONTRACT_ID" --source "$THROWAWAY_KEY" \
              --rpc-url "$RPC" --network-passphrase "$PASSPHRASE" \
              -- extend --ledgers "$EXTEND_TO" >/dev/null

          # --- 3. Verify off-chain. ---
          FINAL_TTL="$(read_ttl)"
          echo "post-restore ttl=$FINAL_TTL ledgers (~$(( FINAL_TTL * 5 / 3600 ))h)"
          echo "ttl=$FINAL_TTL" >> "$GITHUB_OUTPUT"

          [[ "$FINAL_TTL" -gt 0 ]] || { echo "::error::entry is still archived after restore"; exit 1; }

      - name: Summarize
        run: |
          echo "Demo entry restored. TTL now ${{ steps.restore.outputs.ttl }} ledgers. The scheduled demo-scan.yml should go green on its next run."