# demo-scan.yml — scheduled, read-only scan of the demo entry's TTL on TESTNET.
#
# Unlike the repo's interactive scripts, this workflow is self-contained: it
# reads the TTL through the contract's own `ttl()` function using the public
# `stellar` CLI, so CI does not need the soroban-state-sentinel binary. It
# reports the health band and fails the run when the entry goes Critical or
# Archives, so a decaying entry turns the schedule red.
#
# ⚠️  TESTNET ONLY. The key used below is the TESTNET-ONLY throwaway key
# generated by scripts/deploy-and-shrink-ttl.sh. Never put a mainnet key in
# these secrets.
#
# Setup:
#   1. Deploy once locally:  ./scripts/deploy-and-shrink-ttl.sh
#   2. Actions -> Variables -> New repository variable:
#        Name: CONTRACT_ID,  Value: <the contract id printed by step 1>
#   3. Actions -> Secrets -> New repository secret:
#        Name: TESTNET_THROWAWAY_SECRET_KEY,
#        Value: <the S... key in .deploy/testnet-throwaway.secret>
#   4. Run once via the "Run workflow" button (workflow_dispatch) to confirm,
#      then let the cron take over (every 6 hours by default).

name: demo-scan

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stellar-cli
        run: |
          curl -fsSL https://raw.githubusercontent.com/stellar/stellar-cli/main/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Scan demo entry TTL
        id: scan
        env:
          CONTRACT_ID: ${{ vars.CONTRACT_ID }}
          THROWAWAY_KEY: ${{ secrets.TESTNET_THROWAWAY_SECRET_KEY }}
        run: |
          set -euo pipefail
          RPC="https://soroban-testnet.stellar.org"
          PASSPHRASE="Test SDF Network ; September 2015"

          [[ -n "${CONTRACT_ID:-}" ]] || { echo "::error::CONTRACT_ID repository variable is not set (see workflow header)"; exit 1; }
          [[ -n "${THROWAWAY_KEY:-}" ]] || { echo "::error::TESTNET_THROWAWAY_SECRET_KEY secret is not set (see workflow header)"; exit 1; }

          OUT="$(stellar contract invoke \
              --id "$CONTRACT_ID" --source "$THROWAWAY_KEY" \
              --rpc-url "$RPC" --network-passphrase "$PASSPHRASE" \
              -- ttl 2>&1 || true)"

          if grep -qiE 'archived|evicted|not found|restore' <<<"$OUT"; then
            # Invoking against an archived entry fails because the footprint
            # references an entry that must be restored first — that failure
            # IS the Archived signal.
            BAND="Archived"
            TTL=0
          else
            TTL="$(grep -oE '^[0-9]+' <<<"$OUT" | head -n1)"
            TTL="${TTL:-0}"
            # "Critical" mirrors the sentinel's floor: less than a day of TTL
            # (~17,280 ledgers at ~5s) means the next restore window is at risk.
            if (( TTL <= 17280 )); then BAND="Critical"; else BAND="Healthy"; fi
          fi

          echo "band=$BAND" >> "$GITHUB_OUTPUT"
          echo "ttl=$TTL" >> "$GITHUB_OUTPUT"
          echo "contract=$CONTRACT_ID ttl=$TTL ledgers (~$(( TTL * 5 / 3600 ))h) band=$BAND"

      - name: Fail when the entry needs attention
        if: steps.scan.outputs.band == 'Critical' || steps.scan.outputs.band == 'Archived'
        run: |
          echo "::error::Demo entry is ${{ steps.scan.outputs.band }} (ttl=${{ steps.scan.outputs.ttl }} ledgers). Remediate with: ./scripts/run-full-pipeline.sh --wait-for ${{ steps.scan.outputs.band }}"
          exit 1