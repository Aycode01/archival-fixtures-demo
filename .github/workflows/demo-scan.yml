# demo-scan.yml — scheduled, read-only scan of the demo entry's TTL on TESTNET.
#
# Self-contained by design: it reads the entry's TTL off-chain via RPC
# `getLedgerEntries` (scripts/read-entry-ttl.py — stdlib python, no stellar
# CLI, no sentinel binary needed), reports the health band, and fails the
# run when the entry goes Critical or Archived, so a decaying entry turns
# the schedule red.
#
# Why off-chain: contracts cannot read their own TTL (CAP-0046-12; the SDK
# `get_ttl` helpers are testutils-only), and Soroban RPC rejects direct
# `LedgerKey::Ttl` queries — but it populates `liveUntilLedgerSeq` on the
# entries it returns, which this script reads. Same signal the
# soroban-state-sentinel uses.
#
# ⚠️  TESTNET ONLY. The key referenced below is the TESTNET-ONLY throwaway
# key generated by scripts/deploy-and-shrink-ttl.sh. Never put a mainnet
# key in these secrets.
#
# Setup:
#   1. Deploy once locally:  ./scripts/deploy-and-shrink-ttl.sh
#   2. Actions -> Variables -> New repository variable:
#        Name: CONTRACT_ID,  Value: <the contract id printed by step 1>
#   3. Actions -> Secrets -> New repository secret:
#        Name: TESTNET_THROWAWAY_SECRET_KEY,
#        Value: <the S... key in .deploy/testnet-throwaway.secret>
#      (the secret is not used by this read-only workflow, but demo-restore.yml
#       needs it; keeping both setup steps together avoids surprises)
#   4. Run once via the "Run workflow" button (workflow_dispatch) to confirm,
#      then let the cron take over (every 6 hours by default).

name: demo-scan

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan demo entry TTL
        id: scan
        env:
          CONTRACT_ID: ${{ vars.CONTRACT_ID }}
        run: |
          set -euo pipefail
          RPC="https://soroban-testnet.stellar.org"

          [[ -n "${CONTRACT_ID:-}" ]] || { echo "::error::CONTRACT_ID repository variable is not set (see workflow header)"; exit 1; }

          TTL="$(python3 scripts/read-entry-ttl.py --contract-id "$CONTRACT_ID" --rpc-url "$RPC")"

          # TTL is in ledgers. 0 means the entry is archived (no live entry /
          # no liveUntilLedgerSeq on the RPC response).
          if (( TTL <= 0 )); then
            BAND="Archived"
          elif (( TTL <= 17280 )); then
            # "Critical" mirrors the sentinel's floor with this repo's
            # thresholds (--critical-days 1): less than a day of TTL
            # (~17,280 ledgers at ~5s) means the next restore window is at
            # risk.
            BAND="Critical"
          else
            BAND="Healthy"
          fi

          echo "band=$BAND" >> "$GITHUB_OUTPUT"
          echo "ttl=$TTL" >> "$GITHUB_OUTPUT"
          echo "contract=$CONTRACT_ID ttl=$TTL ledgers (~$(( TTL * 5 / 3600 ))h) band=$BAND"

      - name: Fail when the entry needs attention
        if: steps.scan.outputs.band == 'Critical' || steps.scan.outputs.band == 'Archived'
        run: |
          echo "::error::Demo entry is ${{ steps.scan.outputs.band }} (ttl=${{ steps.scan.outputs.ttl }} ledgers). Remediate with: ./scripts/run-full-pipeline.sh --wait-for ${{ steps.scan.outputs.band }} or the demo-restore workflow"
          exit 1