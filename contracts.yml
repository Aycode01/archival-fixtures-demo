# contracts.yml — fixture manifest for the archival-fixtures-demo suite, in the
# shape the action-state-watch consumer actually loads.
#
# Schema source of truth: Aycode01/action-state-watch, `src/config.ts`
# (`loadConfig` / `validateContractEntry` / `validateAlertConfig`), read
# 2026-09-14 once that repo became public (issue #4). That loader reads
# `network`, `contracts[]` and `alert`, and SILENTLY DROPS unknown keys — which
# is what lets this file carry the demo's fixture metadata (wasm path, deploy
# script, entry XDR, rpc_url) alongside the fields the consumer requires.
#
# ⚠️  action-state-watch's self-check workflow does NOT read this file. It runs
# with `config-path: contracts.example.yml`, a copy inside that repo seeded from
# an earlier draft of this manifest. This file is the fixture-side source of
# truth; the consumer copy still needs aligning separately.
#
# `address` is required by the consumer, so it is literal here. Deployments are
# throwaway and get a fresh id each time (scripts/deploy-and-shrink-ttl.sh
# writes .deploy/contract-id.txt), so a redeploy means updating `address` too —
# the consumer cannot resolve an id indirectly.
#
# Validate with: python3 scripts/validate-contracts-schema.py contracts.yml
#
# ⚠️  TESTNET ONLY. The entry below lives on Stellar testnet and is funded,
# signed, and restored with a TESTNET-ONLY throwaway key. Never point these
# values at mainnet.

version: 1

# --- fields the action-state-watch consumer loads -------------------------

network: testnet

contracts:
  - address: 'CAEDHSOD3TXIAZF2BZMMNX7A2OKBCVE4WU7A6RWTHGGHWHJXHEQUMAT4'
    label: 'archival-fixtures-demo rapid-expiry entry'
    keys:
      # SCVal Symbol "VALUE", XDR 4-byte aligned (3 pad bytes).
      - 'AAAADwAAAAVWQUxVRQAAAA=='
    # A fresh entry (~7 days) must read Healthy and flip to Critical at <= 1
    # day so the demo arc is observable. The sentinel's defaults (30d/7d) would
    # false-flag a ~7-day entry as Critical immediately. scripts/lib.sh mirrors
    # these two numbers as SCAN_HEALTHY_DAYS / SCAN_CRITICAL_DAYS.
    healthy-days: 1
    critical-days: 1

    # --- fixture metadata (read by the demo scripts/docs, not the consumer) ---

    name: rapid-expiry-demo
    description: >-
      Single persistent entry (key "VALUE") created at the testnet network
      minimum TTL (120,960 ledgers ≈ 7 days) and never extended, so it decays
      Healthy -> Critical -> Archived on a predictable real-time timeline and
      must be restored with RestoreFootprintOp.
    rpc_url: https://soroban-testnet.stellar.org
    network_passphrase: "Test SDF Network ; September 2015"
    # Where a redeploy records the fresh id; keep `address` above in sync.
    contract_id_env: CONTRACT_ID
    wasm: contracts/rapid-expiry-demo/target/wasm32v1-none/release/rapid_expiry_demo.wasm
    deploy_script: scripts/deploy-and-shrink-ttl.sh
    entries:
      - key: VALUE
        key_scval_xdr: "AAAADwAAAAVWQUxVRQAAAA==" # Symbol "VALUE" (XDR 4-byte padded)
        durability: persistent
        min_persistent_ttl_ledgers: 120960

# --- optional consumer fields --------------------------------------------

alert:
  dedupe-window-hours: 24
